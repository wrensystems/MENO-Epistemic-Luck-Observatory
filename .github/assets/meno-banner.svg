<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MENO: Epistemic Luck Observatory</title>
  <desc id="desc">A dark observatory graphic with cyan and violet orbital paths. Python 3.11+, standard library runtime, offline workflow.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080F20"/>
      <stop offset="0.55" stop-color="#111B35"/>
      <stop offset="1" stop-color="#0A1325"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1010 158) rotate(90) scale(240 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6A65D8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6A65D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="830" y1="30" x2="1160" y2="285" gradientUnits="userSpaceOnUse">
